name: Rule request

# Opens (or updates) a pull request to develop from an issue filed with the "Password rule request" form.
# Requires "Allow GitHub Actions to create and approve pull requests" in Settings → Actions → General.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: rule-request-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pull-request:
    # only issues made from .github/ISSUE_TEMPLATE/rule-request.yml
    if: github.event.issue.state == 'open' && startsWith(github.event.issue.title, '[Rule]') && contains(github.event.issue.body, '### Rule JSON')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BRANCH: feature/rule-request-${{ github.event.issue.number }}
    steps:
      - run: |
          echo "ERRORS_FILE=$RUNNER_TEMP/errors.md" >> "$GITHUB_ENV"
          echo "PR_BODY_FILE=$RUNNER_TEMP/pr-body.md" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Write rule.json from the issue
        id: rule
        env:
          # issue text is untrusted, so it only reaches the script through the environment
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: bun scripts/rule-request.ts

      - name: Test rules
        run: bun test src/rules.test.ts

      - name: Push branch and open pull request
        env:
          DOMAIN: ${{ steps.rule.outputs.domain }}
          ACTION: ${{ steps.rule.outputs.action }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "databases/$DOMAIN/rule.json"
          title="feat: $ACTION $DOMAIN rule"
          git commit -m "$title" -m "From #$ISSUE_NUMBER"
          git push --force origin "$BRANCH"
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$PR_BODY_FILE"
            gh issue comment "$ISSUE_NUMBER" --body "Updated #$number from the edited issue."
          else
            url=$(gh pr create --base develop --head "$BRANCH" --title "$title" --body-file "$PR_BODY_FILE")
            gh issue comment "$ISSUE_NUMBER" --body "Opened $url from this request."
          fi

      - name: Report problems on the issue
        if: failure()
        run: |
          if [ ! -s "$ERRORS_FILE" ]; then
            echo "The rule request workflow failed. See the [run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." > "$ERRORS_FILE"
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file "$ERRORS_FILE"
