name: Publish to GitHub Packages

# Publishes the package to GitHub Packages (npm.pkg.github.com) as @startergate/zero-password.
# npmjs keeps the unscoped name "zero-password" (published with `bun run deploy`).
# Runs when a GitHub release is published, or manually from the Actions tab for the current version on main.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: github-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@startergate'

      - run: bun install --frozen-lockfile

      - run: bun test

      - run: bun run build

      # GitHub Packages only accepts scoped names owned by the repository owner
      - run: npm pkg set name=@startergate/zero-password

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
